<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0f19">
<title>{% block title %}GameCheck{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}">
</head>
<body>
<header class="header"><div class="wrap nav"><a class="brand" href="{{ url_for('index') }}">🎮 <span>Game<span class="accent">Check</span></span></a><span class="nav-note">Descubra • Avalie • Compartilhe</span></div></header>
<main class="wrap">
{% with messages = get_flashed_messages(with_categories=true) %}
{% for category,message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>
<footer class="wrap footer">GameCheck • Projeto demonstrativo local • Feito com Flask + SQLite</footer>
</body></html>
